{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "matterhub.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matterhub.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
  {{- end }}
# The app never calls the Kubernetes API, so don't mount an API token.
automountServiceAccountToken: false
{{- end }}
