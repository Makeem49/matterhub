{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "matterhub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matterhub.labels" . | nindent 4 }}
spec:
  {{- include "matterhub.secretProviderClassSpec" . | nindent 2 }}
{{- end }}
