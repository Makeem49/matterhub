# Composite action: apply the reviewed plan for one environment, then deploy the ARM
# log-search alerts that depend on Terraform outputs.
name: terraform-apply
description: Apply a saved Terraform plan and deploy the ARM log alerts for an environment

inputs:
  environment:
    description: dev or prod
    required: true
  terraform-version:
    description: Terraform version constraint
    default: "~1.13"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - uses: actions/download-artifact@v4
      with:
        name: tfplan-${{ inputs.environment }}
        path: infra/terraform/envs/${{ inputs.environment }}

    - name: terraform apply (saved plan only)
      shell: bash
      working-directory: infra/terraform/envs/${{ inputs.environment }}
      run: |
        terraform init -input=false -backend-config=backend.hcl
        terraform apply -input=false tfplan

    - uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    - name: Deploy ARM log-search alerts
      shell: bash
      working-directory: infra/terraform/envs/${{ inputs.environment }}
      run: |
        out="$(terraform output -json platform)"
        rg="$(jq -r .resource_group_name <<<"$out")"
        az deployment group create \
          --name "log-alerts-${GITHUB_RUN_ID}" \
          --resource-group "$rg" \
          --template-file "$GITHUB_WORKSPACE/infra/arm/log-alerts/azuredeploy.json" \
          --parameters "@$GITHUB_WORKSPACE/infra/arm/log-alerts/azuredeploy.parameters.${{ inputs.environment }}.json" \
          --parameters workspaceResourceId="$(jq -r .log_analytics_workspace_id <<<"$out")" \
                       actionGroupId="$(jq -r .action_group_id <<<"$out")"
