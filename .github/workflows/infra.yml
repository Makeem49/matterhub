# Terraform: plan on pull requests (posted as a PR comment), apply on main.
#
# Pull request: plan dev and prod with a READ-ONLY identity (GitHub environments
#               "dev-plan"/"prod-plan"), so an unreviewed branch can never change Azure.
# main:         plan -> apply dev -> plan -> [approval] -> apply prod. Each apply uses the
#               exact plan file that was reviewed, never a fresh plan.
name: infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/arm/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "infra/arm/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false # never interrupt an apply holding the state lock

env:
  TF_VERSION: "~1.13"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  plan-pr:
    name: Plan ${{ matrix.env }} (PR)
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            runner: '"ubuntu-latest"'
          - env: prod
            runner: '["self-hosted", "linux", "matterhub-prod"]' # private data plane
    runs-on: ${{ fromJSON(matrix.runner) }}
    environment: ${{ matrix.env }}-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -backend-config=backend.hcl -lock=false
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes, 1 = error
          [ "$code" -ne 1 ]
      - name: Comment the plan on the pull request
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const path = `infra/terraform/envs/${process.env.ENV_NAME}/plan.txt`;
            const full = fs.readFileSync(path, 'utf8');
            const summary = (full.match(/^(Plan:.*|No changes\..*)$/m) || ['(see logs)'])[0];
            const body = [
              `### Terraform plan: \`${process.env.ENV_NAME}\``,
              `**${summary}**`,
              '<details><summary>Full plan</summary>',
              '',
              '```hcl',
              full.length > 60000 ? full.slice(-60000) : full,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  plan:
    name: Plan ${{ matrix.env }}
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - env: dev
            runner: '"ubuntu-latest"'
          - env: prod
            runner: '["self-hosted", "linux", "matterhub-prod"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    environment: ${{ matrix.env }}-plan
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -backend-config=backend.hcl
      - run: terraform plan -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: infra/terraform/envs/${{ matrix.env }}/tfplan
          retention-days: 1 # plans can contain sensitive values

  apply-dev:
    name: Apply dev
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply
        with:
          environment: dev

  apply-prod:
    name: Apply prod
    needs: [plan, apply-dev]
    runs-on: [self-hosted, linux, matterhub-prod]
    environment: prod # required reviewers
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply
        with:
          environment: prod
