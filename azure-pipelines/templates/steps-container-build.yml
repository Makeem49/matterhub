# Build the image, lint the Dockerfile, scan with Trivy, push (main only) and expose the
# digest as an output variable so later stages deploy exactly this image.
parameters:
  - name: containerRegistryConnection
    type: string
  - name: registry
    type: string
  - name: push
    type: boolean
    default: false

steps:
  - bash: docker run --rm -i hadolint/hadolint:v2.12.0 < app/Dockerfile
    displayName: Hadolint

  - task: Docker@2
    displayName: Build
    inputs:
      command: build
      repository: matterhub
      containerRegistry: ${{ parameters.containerRegistryConnection }}
      Dockerfile: app/Dockerfile
      buildContext: app
      tags: $(Build.SourceVersion)
      arguments: --build-arg GIT_SHA=$(Build.SourceVersion) --build-arg APP_VERSION=1.0.$(Build.BuildId)

  - bash: |
      set -euo pipefail
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b ./bin
      ./bin/trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
        "${{ parameters.registry }}/matterhub:$(Build.SourceVersion)"
    displayName: Trivy scan (fail on fixable HIGH/CRITICAL)

  - ${{ if eq(parameters.push, true) }}:
      - task: Docker@2
        displayName: Push
        inputs:
          command: push
          repository: matterhub
          containerRegistry: ${{ parameters.containerRegistryConnection }}
          tags: $(Build.SourceVersion)

      - bash: |
          set -euo pipefail
          ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ parameters.registry }}/matterhub:$(Build.SourceVersion)")"
          digest="${ref#*@}"
          echo "Pushed ${ref}"
          echo "##vso[task.setvariable variable=imageDigest;isOutput=true]${digest}"
        name: push
        displayName: Capture image digest
