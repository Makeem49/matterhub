# Local Prometheus (docker compose). In AKS the same metrics are scraped by
# Azure Monitor managed Prometheus via the ServiceMonitor in the Helm chart.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: matterhub-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: matterhub-api
          environment: local
