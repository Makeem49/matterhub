[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matterhub"
version = "1.0.0"
description = "MatterHub - a legal matter tracking API used to demonstrate DevOps practice on Azure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Akeem Moshood" }]
# Runtime dependencies are pinned with hashes in requirements.txt (compiled from requirements.in).
# The ranges here exist so `pip install -e .` works for local development.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "prometheus-client>=0.20",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
azure = ["azure-monitor-opentelemetry>=1.6"]

[project.scripts]
matterhub = "matterhub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matterhub = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit (security)
  "SIM",           # simplify
  "RUF",
]
ignore = ["B008"]  # FastAPI uses calls in default args (Depends/Query) by design

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests
"src/matterhub/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["matterhub"]
exclude = ["src/matterhub/migrations/"]

[[tool.mypy.overrides]]
module = ["azure.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that need a real PostgreSQL (set MATTERHUB_TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["matterhub"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
