# Developer convenience: `alembic revision --autogenerate -m "..."` from the app/ folder.
# In containers, migrations run with `matterhub migrate` (no ini file needed).
[alembic]
script_location = src/matterhub/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
