# Checkov policy-as-code configuration, used by CI and pre-merge checks.
# Every skipped check carries a reason. Skips are reviewed quarterly (docs/security.md).
compact: true
quiet: true
skip-path:
  - deploy/helm/matterhub/templates   # raw templates are scanned after `helm template`
skip-check:
  # --- Controls enabled per environment through tfvars (prod: on, dev: off for cost).
  # Checkov evaluates module defaults, so it cannot see the prod values.
  - CKV_AZURE_115   # AKS private cluster: prod private_cluster_enabled = true
  - CKV_AZURE_170   # AKS paid SLA tier: prod sku_tier = "Standard"
  - CKV_AZURE_136   # PostgreSQL geo-redundant backup: prod geo_redundant_backup_enabled = true
  - CKV_AZURE_189   # Key Vault public network access: prod private_data_plane = true
  - CKV_AZURE_233   # ACR zone redundancy: Premium (prod) only
  # --- False positives
  - CKV2_AZURE_57   # PostgreSQL uses VNet integration (private access), not a private endpoint; no public access
  - CKV_AZURE_87    # Defender for Key Vault IS enabled; Checkov cannot evaluate the plans loop in defender.bicep
  # --- Accepted risk / on the hardening backlog (docs/security.md#hardening-backlog)
  - CKV_AZURE_117   # Customer-managed disk encryption set: platform-managed keys accepted for OFFICIAL
  - CKV_AZURE_164   # ACR content trust is deprecated; images carry SLSA provenance, Notation signing planned
  - CKV_AZURE_165   # ACR geo-replication: single-region service; DR re-imports images into UK West
  - CKV_AZURE_166   # ACR quarantine: images are scanned in CI (Trivy) and by Defender for Containers
  - CKV_AZURE_41    # Secret expiry: rotation is enforced by runbook + password_version, not expiry dates
  # --- Kubernetes
  - CKV_K8S_8       # Liveness probe: not meaningful for the short-lived `helm test` pod
  - CKV_K8S_9       # Readiness probe: as above
  - CKV_K8S_43      # Image digest: pipelines deploy by digest; local/kind uses a tag by design
  - CKV_K8S_15      # imagePullPolicy Always: images are pinned by immutable digest, so IfNotPresent is safe
